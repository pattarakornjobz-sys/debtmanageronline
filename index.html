  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1p 0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Sans Thai';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"3a100f80-dff1-40fb-9e4a-6dadd25b2500\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>body{margin:0;background:var(--color-neutral-200);font-family:\"Barlow\",\"IBM Plex Sans Thai\",sans-serif}a{color:var(--color-accent-700)}a:hover{color:var(--color-accent-800)}@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.input{font-size:16px}html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}input[type=range]{accent-color:var(--color-accent)}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100dvh;background:var(--color-neutral-200)\">\n\n<div style=\"width:100%;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;position:relative;background:var(--color-bg);box-shadow:var(--shadow-md)\">\n  <div style=\"position:absolute;top:env(safe-area-inset-top);bottom:calc(64px + env(safe-area-inset-bottom));left:0;right:0;overflow-y:auto;scrollbar-width:none\">\n\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"padding:12px 20px 28px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center\">\n        <div><div style=\"font-size:12px;color:var(--color-neutral-700)\">{{ todayLabel }}<\u002Fdiv><div style=\"font:600 24px/1.2 'Barlow Condensed','IBM Plex Sans Thai',sans-serif\">ภาพรวมหนี้<\u002Fdiv><\u002Fdiv>\n        <button class=\"btn btn-secondary btn-icon\" sc-camel-on-click=\"{{ openAdd }}\" aria-label=\"เพิ่มหนี้\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ noDebts }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"blueprint\" style=\"padding:22px;display:flex;flex-direction:column;gap:16px;background:var(--color-accent-900);color:var(--color-bg);border-color:var(--color-accent-900)\">\n          <i class=\"corner tl\" style=\"color:var(--color-accent-400)\"><\u002Fi><i class=\"corner tr\" style=\"color:var(--color-accent-400)\"><\u002Fi><i class=\"corner bl\" style=\"color:var(--color-accent-400)\"><\u002Fi><i class=\"corner br\" style=\"color:var(--color-accent-400)\"><\u002Fi>\n          <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-300)\">เริ่มต้น<\u002Fdiv>\n          <div style=\"font:600 34px/1.05 'Barlow Condensed','IBM Plex Sans Thai',sans-serif\">ใส่หนี้ทุกก้อน<br>แล้วเราวางแผนปลดให้<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--color-accent-200)\">\n            <div style=\"display:flex;gap:10px\"><span style=\"color:oklch(0.86 0.15 165);font-family:'Barlow Condensed';font-weight:600\">01<\u002Fspan>เพิ่มหนี้: ยอดคงเหลือ ดอกเบี้ย ขั้นต่ำ วันครบกำหนด<\u002Fdiv>\n            <div style=\"display:flex;gap:10px\"><span style=\"color:oklch(0.86 0.15 165);font-family:'Barlow Condensed';font-weight:600\">02<\u002Fspan>เลือกกลยุทธ์ Snowball หรือ Avalanche<\u002Fdiv>\n            <div style=\"display:flex;gap:10px\"><span style=\"color:oklch(0.86 0.15 165);font-family:'Barlow Condensed';font-weight:600\">03<\u002Fspan>บันทึกทุกงวดที่จ่าย ดูหนี้ลดลงทุกเดือน<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ openAdd }}\" style=\"min-height:48px;border:0;background:oklch(0.86 0.15 165);color:var(--color-accent-900);font:600 16px 'IBM Plex Sans Thai',sans-serif;cursor:pointer\">+ เพิ่มหนี้ก้อนแรก<\u002Fbutton>\n        <\u002Fdiv>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ loadSample }}\" style=\"align-self:center\">ลองดูด้วยข้อมูลตัวอย่าง<\u002Fbutton>\n        <div style=\"font-size:11.5px;line-height:1.5;color:var(--color-neutral-700);text-align:center\">ข้อมูลเก็บไว้ในเครื่องนี้เท่านั้น ไม่ถูกส่งไปที่ใด<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ hasDebts }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"blueprint\" style=\"padding:20px;display:flex;flex-direction:column;gap:16px;background:var(--color-accent-900);color:var(--color-bg);border-color:var(--color-accent-900);box-shadow:var(--shadow-lg)\">\n        <i class=\"corner tl\" style=\"color:var(--color-accent-400)\"><\u002Fi><i class=\"corner tr\" style=\"color:var(--color-accent-400)\"><\u002Fi><i class=\"corner bl\" style=\"color:var(--color-accent-400)\"><\u002Fi><i class=\"corner br\" style=\"color:var(--color-accent-400)\"><\u002Fi>\n        <div style=\"display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-300)\"><span>หนี้คงเหลือทั้งหมด<\u002Fspan><span>{{ debtCount }} บัญชี<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:10px\">\n          <div style=\"font:600 52px/0.95 'Barlow Condensed',sans-serif;letter-spacing:-.01em\">฿{{ totalBal }}<\u002Fdiv>\n          <div style=\"text-align:right\"><div style=\"font:600 30px/1 'Barlow Condensed',sans-serif;color:oklch(0.86 0.15 165)\">{{ paidPct }}%<\u002Fdiv><div style=\"font-size:11px;color:var(--color-accent-300)\">ปลดแล้ว<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <div style=\"height:8px;background:color-mix(in srgb,var(--color-bg) 14%,transparent);position:relative\"><div style=\"position:absolute;inset:0 auto 0 0;width:{{ paidPctW }};background:oklch(0.86 0.15 165);transition:width .5s\"><\u002Fdiv><\u002Fd ',sans-serif\">{{ dt.rateLabel }} <span style=\"font-size:12px;font-weight:400;font-family:'IBM Plex Sans Thai'\">{{ dt.rateType }}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <div style=\"padding:10px 12px;border-right:1px solid var(--color-divider)\"><div style=\"font-size:11px;color:var(--color-neutral-700)\">ขั้นต่ำ/เดือน<\u002Fdiv><div style=\"font:600 22px 'Barlow Condensed',sans-serif\">฿{{ dt.min }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"padding:10px 12px\"><div style=\"font-size:11px;color:var(--color-neutral-700)\">ครบกำหนด<\u002Fdiv><div style=\"font:600 22px 'Barlow Condensed','IBM Plex Sans Thai',sans-serif\">ทุกวันที่ {{ dt.due }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--color-neutral-800)\">ตามแผนปัจจุบันจะปิดได้ <b style=\"color:var(--color-accent-800)\">{{ dt.closeDate }}<\u002Fb> · ดอกเบี้ยเดือนนี้ ≈ ฿{{ dt.intNow }}<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px\">\n            <div style=\"font:600 17px 'Barlow Condensed','IBM Plex Sans Thai',sans-serif\">บันทึกการชำระ<\u002Fdiv>\n            <div class=\"field\"><label>จำนวนเงินที่จ่าย (บาท)<\u002Flabel><input class=\"input\" inputmode=\"numeric\" value=\"{{ payAmt }}\" sc-camel-on-change=\"{{ onPayAmt }}\" style=\"font-size:18px;font-family:'Barlow',sans-serif\"><\u002Fdiv>\n            <div style=\"height:6px;display:flex;gap:2px\"><div style=\"width:{{ pv.prinW }};background:oklch(0.68 0.14 165);transition:width .2s\"><\u002Fdiv><div style=\"flex:1;background:oklch(0.7 0.15 35)\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-size:12px\"><span style=\"color:oklch(0.42 0.1 165)\">ตัดเงินต้น ฿{{ pv.prin }}<\u002Fspan><span style=\"color:oklch(0.48 0.13 35)\">ดอกเบี้ย ฿{{ pv.int }}<\u002Fspan><\u002Fdiv>\n            <sc-if value=\"{{ pv.warn }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:var(--color-neutral-800);background:var(--color-neutral-100);padding:8px 10px;border:1px solid var(--color-divider)\">ยอดนี้ต่ำกว่าขั้นต่ำ ฿{{ dt.min }} อาจโดนค่าปรับ<\u002Fdiv><\u002Fsc-if>\n            <button class=\"btn btn-primary blueprint\" style=\"min-height:46px;font-size:16px;margin-top:6px;width:100%\" sc-camel-on-click=\"{{ submitPay }}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>บันทึก ฿{{ payAmtFmt }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ editFromDetail }}\">แก้ไขข้อมูลหนี้<\u002Fbutton><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ deleteDebt }}\" style=\"font-size:13px;color:oklch(0.48 0.13 35)\">{{ deleteLabel }}<\u002Fbutton><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isForm }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center\"><div style=\"font:600 24px 'Barlow Condensed','IBM Plex Sans Thai',sans-serif\">{{ formTitle }}<\u002Fdiv><button class=\"btn btn-ghost btn-icon\" sc-camel-on-click=\"{{ closeSheet }}\" aria-label=\"ปิด\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv>\n          <div class=\"field\"><label>ประเภทหนี้<\u002Flabel>\n            <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px\">\n              <sc-for list=\"{{ typeOpts }}\" as=\"t\" hint-placeholder-count=\"6\">\n                <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"border:1px solid {{ t.bd }};background:{{ t.bg }};color:{{ t.fg }};padding:8px 4px;font:500 12px 'IBM Plex Sans Thai',sans-serif;cursor:pointer\">{{ t.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"field\"><label>ชื่อเรียก<\u002Flabel><input class=\"input\" placeholder=\"เช่น บัตร KTC\" value=\"{{ form.name }}\" sc-camel-on-change=\"{{ fName }}\"><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n            <div class=\"field\"><label>ยอดหนี้คงเหลือ (฿)<\u002Flabel><input class=\"input\" inputmode=\"decimal\" value=\"{{ form.bal }}\" sc-camel-on-change=\"{{ fBal }}\"><\u002Fdiv>\n            <div class=\"field\"><label>{{ origLabel }}<\u002Flabel><input class=\"input\" inputmode=\"decimal\" placeholder=\"{{ origPh }}\" value=\"{{ form.orig }}\" sc-camel-on-change=\"{{ fOrig }}\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--color-divider)\">\n            <div style=\"font:600 16px 'Barlow Condensed','IBM Plex Sans Thai',sans-serif\">อัตราดอกเบี้ย<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:stretch\">\n              <div style=\"position:relative\"><input class=\"input\" inputmode=\"decimal\" placeholder=\"0\" value=\"{{ form.rate }}\" sc-camel-on-change=\"{{ fRate }}\" style=\"width:100%;box-sizing:border-box;padding-right:26px;font-size:17px;font-family:'Barlow',sans-serif\"><span style=\"position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--color-neutral-700)\">%<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--color-divider)\"><sc-for list=\"{{ unitOpts }}\" as=\"u\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ u.onClick }}\" style=\"border:0;border-right:{{ u.br }};background:{{ u.bg }};color:{{ u.fg }};padding:9px 4px;font:500 13px 'IBM Plex Sans Thai',sans-serif;cursor:pointer\">{{ u.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--color-divider)\"><sc-for list=\"{{ rateOpts }}\" as=\"t\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ t.onClick }}\" style=\"border:0;border-right:{{ t.br }};background:{{ t.bg }};color:{{ t.fg }};padding:9px 4px;font:500 13px 'IBM Plex Sans Thai',sans-serif;cursor:pointer\">{{ t.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n            <div style=\"font-size:12px;line-height:1.55;color:var(--color-neutral-800);text-wrap:pretty\">{{ methodHint }}<\u002Fdiv>\n            <sc-if value=\"{{ formCalc }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:10px;border-top:1px solid var(--color-divider)\">\n                <div><div style=\"font-size:11px;color:var(--color-neutral-700)\">เทียบเป็นต่อปี<\u002Fdiv><div style=\"font:600 19px 'Barlow Condensed','IBM Plex Sans Thai',sans-serif\">{{ formCalc.annual }}<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11px;color:var(--color-neutral-700)\">ดอกเบี้ยเดือนแรก ≈<\u002Fdiv><div style=\"font:600 19px 'Barlow Condensed',sans-serif;color:oklch(0.48 0.13 35)\">฿{{ formCalc.int }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n            <div class=\"field\"><label>ขั้นต่ำ/เดือน (฿)<\u002Flabel><input class=\"input\" inputmode=\"decimal\" value=\"{{ form.min }}\" sc-camel-on-change=\"{{ fMin }}\"><\u002Fdiv>\n            <div class=\"field\"><label>วันครบกำหนด (1–31)<\u002Flabel><input class=\"input\" inputmode=\"numeric\" value=\"{{ form.due }}\" sc-camel-on-change=\"{{ fDue }}\"><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ isCardForm }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:11.5px;color:var(--color-neutral-700);margin-top:-6px\">บัตรเครดิต: แอปใช้ขั้นต่ำ 8% ของยอด หรือยอดที่กรอก แล้วแต่ว่ายอดไหนสูงกว่า<\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ formErr }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:var(--color-neutral-900);background:var(--color-neutral-200);padding:8px 10px\">{{ formErr }}<\u002Fdiv><\u002Fsc-if>\n          <button class=\"btn btn-primary blueprint\" style=\"min-height:46px;font-size:16px;width:100%\" sc-camel-on-click=\"{{ submitAdd }}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>{{ formSubmit }}<\u002Fbutton>\n          <sc-if value=\"{{ isEdit }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ deleteDebt }}\" style=\"width:100%;font-size:13px;color:oklch(0.48 0.13 35)\">{{ deleteLabel }}<\u002Fbutton><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;left:20px;right:20px;bottom:calc(80px + env(safe-area-inset-bottom));background:var(--color-neutral-900);color:var(--color-bg);padding:12px 14px;font-size:13px;animation:fadeIn .2s\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultStrategy&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;snowball&quot;,&quot;avalanche&quot;,&quot;custom&quot;],&quot;default&quot;:&quot;avalanche&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Plan&quot;}}\">\nconst TYPES = { card:'บัตรเครดิต', home:'สินเชื่อบ้าน', car:'สินเชื่อรถ', personal:'สินเชื่อบุคคล', informal:'นอกระบบ', family:'เพื่อน/ญาติ' };\nconst HUE = { card:30, car:75, personal:295, informal:5, family:155, home:220 };\nconst col = t => { const hh = HUE[t] ?? 250; return { color:'oklch(0.68 0.15 ' + hh + ')', tint:'oklch(0.95 0.035 ' + hh + ')', ink:'oklch(0.42 0.12 ' + hh + ')' }; };\nconst MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];\nconst TODAY = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();\nconst DOW = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสฯ','ศุกร์','เสาร์'];\nconst MONFULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];\nconst BE = TODAY.getFullYear() + 543, M0 = TODAY.getMonth();\nconst MK = TODAY.getFullYear() + '-' + M0;\nconst dayStr = d => d.getDate() + ' ' + MON[d.getMonth()] + ' ' + (d.getFullYear() + 543);\nconst KEY = 'paldnee.v1';\nconst dueDate = (y, m, day) => new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()));\nconst HOME = { id:'home', type:'home', name:'สินเชื่อบ้าน ธอส.', bal:1850000, orig:2400000, apr:5.5, min:14500, due:1, notify:true };\nconst SEED = [\n  { id:'ktc', type:'card', name:'บัตรเครดิต KTC', bal:48500, orig:60000, apr:16, minPct:0.08, min:500, due:5, notify:true },\n  { id:'scb', type:'card', name:'บัตรเครดิต SCB', bal:22300, orig:30000, apr:16, minPct:0.08, min:500, due:12, notify:true },\n  { id:'car', type:'car', name:'สินเชื่อรถ Honda City', bal:380000, orig:560000, apr:2.79, flat:true, min:9850, due:15, notify:true },\n  { id:'per', type:'personal', name:'สินเชื่อบุคคล', bal:120000, orig:200000, apr:25, min:5200, due:25, notify:true },\n  { id:'inf', type:'informal', name:'เงินกู้นอกระบบ', bal:15000, orig:30000, apr:120, rate:10, unit:'month', min:2000, due:28, notify:true },\n  { id:'fam', type:'family', name:'ยืมพี่สาว', bal:5000, orig:20000, apr:0, min:1000, due:30, notify:false },\n];\nconst LOGS = [\n  { id:'fam', d:'30 ก.ย. 2569', amount:1000, prin:1000, int:0 },\n  { id:'inf', d:'27 ก.ย. 2569', amount:2000, prin:400, int:1600 },\n  { id:'per', d:'24 ก.ย. 2569', amount:5200, prin:2620, int:2580 },\n  { id:'car', d:'14 ก.ย. 2569', amount:9850, prin:8548, int:1302 },\n  { id:'scb', d:'11 ก.ย. 2569', amount:1900, prin:1590, int:310 },\n  { id:'ktc', d:'4 ก.ย. 2569', amount:4000, prin:3310, int:690 },\n  { id:'per', d:'24 ส.ค. 2569', amount:5200, prin:2580, int:2620 },\n  { id:'car', d:'14 ส.ค. 2569', amount:9850, prin:8548, int:1302 },\n  { id:'ktc', d:'4 ส.ค. 2569', amount:4100, prin:3380, int:720 },\n];\nconst fmt = n => Math.round(n).toLocaleString('en-US');\nconst monLabel = off => { const t = M0 + off; return MON[((t % 12) + 12) % 12] + ' ' + (BE + Math.floor(t / 12)); };\nconst monShort = off => { const t = M0 + off; return MON[t % 12] + ' ' + String((BE + Math.floor(t / 12)) % 100).padStart(2, '0'); };\nconst dur = m => { const y = Math.floor(m / 12), r = m % 12; return [y ? y + ' ปี' : '', r ? r + ' เดือน' : ''].filter(Boolean).join(' ') || '0 เดือน'; };\nconst curMin = d => d.minPct ? Math.min(d.bal, Math.max(d.bal * d.minPct, d.min)) : Math.min(d.bal, d.min);\nconst effApr = d => d.flat ? d.apr * 1.85 : d.apr;\nconst UNIT = { year: 'ต่อปี', month: 'ต่อเดือน', day: 'ต่อวัน' }, UNIT_S = { year: '/ปี', month: '/เดือน', day: '/วัน' }, PER = { year: 1, month: 12, day: 365 };\nconst norm = d => ({ unit: 'year', rate: d.apr, ...d });\nconst num = v => +(+v).toFixed(4);\nconst rateLabel = d => num(d.rate) + '%' + UNIT_S[d.unit];\nconst annualLabel = d => d.flat ? num(d.apr) + '% (แท้จริง ≈ ' + Math.round(effApr(d)) + '%)' : num(d.apr) + '%';\nconst monthInt = d => d.flat ? d.orig * d.apr / 1200 : d.bal * d.apr / 1200;\n\nfunction simulate(debts, extra, strategy, custom) {\n  const ds = debts.map(d => ({ ...d }));\n  const budget = ds.reduce((s, d) => s + curMin(d), 0) + extra;\n  const order = strategy === 'snowball' ? (a, b) => a.bal - b.bal\n    : strategy === 'custom' ? (a, b) => custom.indexOf(a.id) - custom.indexOf(b.id)\n    : (a, b) => effApr(b) - effApr(a);\n  const series = [ds.reduce((s, d) => s + d.bal, 0)], closed = {};\n  let m = 0, totalInt = 0;\n  while (
